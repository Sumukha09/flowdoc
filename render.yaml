services:
  - type: web
    name: flowdocs-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: LLM_PROVIDER
        value: mock
      - key: POSTGRES_HOST
        fromDatabase:
          name: flowdocs-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: flowdocs-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: flowdocs-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: flowdocs-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: flowdocs-db
          property: password

databases:
  - name: flowdocs-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: flowdocs
    user: flowdocs
